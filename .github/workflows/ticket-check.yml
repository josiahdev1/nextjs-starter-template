name: Ticket Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  ticket:
    name: Require a ticket
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for ticket file
        run: |
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          echo "$CHANGED"

          CODE=$(echo "$CHANGED" | grep -E '^(src/|public/|package\.json|next\.config)' || true)
          TICKET=$(echo "$CHANGED" | grep -E '^tickets/ticket-[0-9]+-.*\.md$' || true)

          if [ -n "$CODE" ] && [ -z "$TICKET" ]; then
            echo "::error::Code changed but no tickets/ticket-XX-*.md was added or updated. Create a ticket from tickets/TEMPLATE.md."
            exit 1
          fi
          echo "Ticket check passed."
